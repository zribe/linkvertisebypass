[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkvertisebypass"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["curl-cffi>=0.15,<1", "httpx>=0.28,<1"]

[project.scripts]
linkvertisebypass = "linkvertisebypass.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linkvertisebypass*"]
