[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkvertisebypass"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "playwright>=1.55,<2"]

[project.scripts]
linkvertisebypass = "linkvertisebypass.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linkvertisebypass*"]
